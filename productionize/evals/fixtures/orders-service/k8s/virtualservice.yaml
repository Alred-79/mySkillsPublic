apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orders-service
spec:
  hosts:
    - orders-service
  http:
    - route:
        - destination:
            host: orders-service
      # VIOLATION (B1, mesh layer): the mesh retries 3 times on top of the in-code retry()
      # in src/retry.js (which also does 3). Same logical call path, retried at two layers:
      # (1 + 3) x (1 + 3) attempts. With no coordination and no jitter in the client layer,
      # this is a synchronized retry storm waiting to happen. There is also no retry budget
      # at the mesh (Istio supports one) to cap the amplification fleet-wide.
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
